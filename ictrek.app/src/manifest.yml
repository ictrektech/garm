id: com.ictrek.garm
name:
  zh-CN: GARM
  en: GARM
description:
  zh-CN: 自托管 GitHub Actions 与 Gitea Actions 运行器管理器。
  en: Self-hosted runner manager for GitHub Actions and Gitea Actions.
version: __APP_VERSION__
author: ictrek
category: [developer]
arch: [amd64, arm64]
require-profiles: true
profiles:
  - name: amd
    title:
      zh-CN: AMD64（x86-64）
      en: AMD64 (x86-64)
    caps:
      arch: amd64
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64（64 位 ARM）
      en: ARM64 (64-bit ARM)
    caps:
      arch: arm64
    conflicts: [amd]
icon: icon.png

platform:
  version: ">=3.0.0"

# VOS single sign-on. The UI is rendered inside the VOS shell, which exposes
# window.vos_platform.api.v1000.oauth2 to run the PKCE flow. The resulting
# access token is exchanged for a GARM JWT on /api/v1/auth/vos.
oauth2:
  client:
    id: com.ictrek.garm
    client_type: public
    redirect_uris:
      - https://app.vos-platform.internal/callback
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none
    access_token_ttl: 3600
    refresh_token_ttl: 1209600

storage:
  directories:
    - path: garm
      uid: 0
      gid: 0
      mode: "0700"
