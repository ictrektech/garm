id: com.ictrek.garm
name:
  zh-CN: GARM
  en: GARM
description:
  zh-CN: 自托管 GitHub Actions 与 Gitea Actions 运行器管理器。
  en: Self-hosted runner manager for GitHub Actions and Gitea Actions.
version: __APP_VERSION__
author: ictrek
category: [developer]
arch: [amd64, arm64]
icon: icon.png

platform:
  version: ">=3.0.0"

# 镜像 tag 带架构前缀，安装时按宿主架构选择对应的 profile。
profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: 使用 AMD64 镜像（飞书 AMD_with_cuda 表）。
      en: Uses the AMD64 image (Feishu AMD_with_cuda sheet).
    caps:
      arch: amd64
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: 使用 ARM64 镜像（飞书 ARM_without_cuda 表）。
      en: Uses the ARM64 image (Feishu ARM_without_cuda sheet).
    caps:
      arch: arm64
    conflicts: [amd]

require-profiles: true

# VOS single sign-on. The UI is rendered inside the VOS shell, which exposes
# window.vos_platform.api.v1000.oauth2 to run the PKCE flow. The resulting
# access token is exchanged for a GARM JWT on /api/v1/auth/vos.
oauth2:
  client:
    id: com.ictrek.garm
    client_type: public
    redirect_uris:
      - https://app.vos-platform.internal/callback
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none
    access_token_ttl: 3600
    refresh_token_ttl: 1209600

storage:
  directories:
    - path: garm
      uid: 0
      gid: 0
      mode: "0700"
