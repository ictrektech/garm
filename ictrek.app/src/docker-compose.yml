services:
  garm:
    image: __IMAGE_REF__
    entrypoint: ["/bin/sh", "/etc/garm/entrypoint.sh"]
    restart: unless-stopped
    networks:
      - vos_default
    environment:
      GARM_LOG_LEVEL: ${GARM_LOG_LEVEL:-info}
      VOS_APP_STORAGE_PATH: ${VOS_APP_STORAGE_PATH}
    volumes:
      - ${VOS_APP_STORAGE_PATH}/garm:/data
      - ./garm:/etc/garm:ro
    labels:
      - "io.ictrek.version=__APP_VERSION__"
      - "traefik.enable=true"
      - "traefik.docker.network=vos_default"
      - "traefik.http.routers.garm-web.rule=PathPrefix(`/app/com.ictrek.garm`)"
      - "traefik.http.routers.garm-web.service=garm-web"
      - "traefik.http.services.garm-web.loadbalancer.server.port=9997"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9997/app/com.ictrek.garm/ui/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  vos_default:
    external: true
