# VOS 联调覆盖：叠加在 docker-compose.dev.yml 之上。
#
#   make vos-dev         起容器 + 装 Traefik 临时路由 + 跟随日志，Ctrl-C 统一收尾
#   make vos-dev-down    撤路由 + 停容器
#
# 只写 Traefik 临时路由文件，不动平台上已安装的 garm 容器；
# 删掉路由文件后流量立即回到已安装应用。
#
# 独立项目名：与 docker-compose.dev.yml 单独起的那套（项目 garm-dev）并存。
# 项目名相同、容器名不同时，compose 会把对方当作配置变更而重建，两套互相摧毁。
name: garm-vos-dev

services:
  garm:
    container_name: ${VOS_DEV_CONTAINER_NAME:-garm-vos-dev}
    networks:
      vos_default:
        aliases:
          - garm-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 与已安装应用一致的 VOS 单点登录；userinfo 走设备内网网关
      GARM_VOS_AUTH_ENABLED: "true"
      GARM_VOS_USERINFO_URL: ${GARM_VOS_USERINFO_URL:-http://172.17.0.1:1182/v1000/oauth2/userinfo}
      # V-Scheduler provider 联调。SCHEDULER_TOKEN 为空时 entrypoint 不写 provider 段。
      SCHEDULER_BASE_URL: ${SCHEDULER_BASE_URL:-http://v-scheduler:38120/api/v1}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      SCHEDULER_CONTAINER_PORT: ${SCHEDULER_CONTAINER_PORT:-8080}
      # garm-runner 的镜像 tag（不含架构前缀）。池的 image 只写仓库名时，
      # provider 用它补上 amd_ 或 arm_ 前缀。与 V-Scheduler 自身的镜像无关。
      GARM_RUNNER_IMAGE_TAG: ${GARM_RUNNER_IMAGE_TAG:-}
      # 池表单 image 字段的默认仓库名。provider 按池架构补 amd_ / arm_ 标签。
      GARM_RUNNER_IMAGE_REPO: ${GARM_RUNNER_IMAGE_REPO:-swr.cn-southwest-2.myhuaweicloud.com/ictrek/garm-runner}

networks:
  vos_default:
    external: true
